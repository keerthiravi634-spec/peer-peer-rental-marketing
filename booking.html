<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentExchange | Booking Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .checkout-box { background: white; border-radius: 24px; border: 1px solid #e2e8f0; padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
    </style>
</head>
<body>

    <div class="container my-5">
        <h3 class="fw-bold mb-4">Complete Your Rental Reservation</h3>
        <div class="row g-4">
            <div class="col-md-7">
                <div class="checkout-box">
                    <h5 class="fw-bold mb-3">Verification Details</h5>
                    <form onsubmit="confirmOrder(event)">
                        <div class="mb-3">
                            <label class="form-label font-semibold">Full Name</label>
                            <input type="text" class="form-control py-2" required placeholder="Enter full name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label font-semibold">Government ID Proof Number</label>
                            <input type="text" class="form-control py-2" required placeholder="Aadhaar / Driving License">
                        </div>
                        <h5 class="fw-bold mt-4 mb-3">Payment Hold</h5>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" checked>
                            <label class="form-check-label">Pay Deposit & Rent on Pickup</label>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-pill">Confirm Rental Request</button>
                    </form>
                </div>
            </div>

            <div class="col-md-5">
                <div class="checkout-box">
                    <h5 class="fw-bold mb-3">Booking Order Summary</h5>
                    <div id="cart-summary-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function loadSummary() {
            const cart = JSON.parse(localStorage.getItem('rental_cart')) || [];
            const list = document.getElementById('cart-summary-list');
            if (cart.length === 0) {
                list.innerHTML = `<p class="text-muted">No items in booking cart.</p>`;
                return;
            }
            let totalSum = 0;
            list.innerHTML = cart.map(i => {
                totalSum += i.grandTotal;
                return `
                    <div class="border-bottom pb-2 mb-2">
                        <h6 class="fw-bold mb-1">${i.title}</h6>
                        <small class="text-muted">Start: ${i.startDate} | Days: ${i.days}</small>
                        <div class="d-flex justify-content-between mt-1 fw-bold">
                            <span>Total Amount:</span>
                            <span class="text-primary">₹${i.grandTotal}</span>
                        </div>
                    </div>
                `;
            }).join('') + `
                <div class="d-flex justify-content-between fs-5 fw-bold mt-3 text-success">
                    <span>Grand Total:</span>
                    <span>₹${totalSum}</span>
                </div>
            `;
        }

        loadSummary();

        function confirmOrder(e) {
            e.preventDefault();
            alert("Booking Request Confirmed Successfully!");
            localStorage.removeItem('rental_cart');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
