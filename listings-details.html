<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listings-Details | RentExchange</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .navbar {
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        .details-card {
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            background: #ffffff;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }
        .product-img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 16px;
        }
        .price-badge {
            font-size: 1.75rem;
            font-weight: 800;
            color: #2563eb;
        }
    </style>
</head>
<body>

    
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 text-primary" href="index.html">
                <i class="bi bi-arrow-repeat fs-3"></i> RentExchange
            </a>
            <div class="ms-auto d-flex gap-2">
                <a href="index.html" class="btn btn-outline-secondary fw-semibold rounded-pill px-3">
                    <i class="bi bi-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </nav>

    
    <div class="container my-5">
        <div class="details-card" id="details-container">
            
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const selectedItem = JSON.parse(localStorage.getItem('selected_rental_item'));
            const container = document.getElementById('details-container');

            if (!selectedItem) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="bi bi-exclamation-circle text-danger display-1 mb-3"></i>
                        <h3 class="fw-bold">No Item Selected</h3>
                        <p class="text-muted mb-4">Please select an item from the listings to view its details.</p>
                        <a href="index.html" class="btn btn-primary fw-semibold px-4 rounded-pill">Browse Rentals</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="row g-5">
                    <div class="col-md-6">
                        <img src="${selectedItem.img}" alt="${selectedItem.title}" class="product-img shadow-sm">
                    </div>
                    <div class="col-md-6 d-flex flex-column justify-content-between">
                        <div>
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="badge bg-light text-primary border px-3 py-2 rounded-pill fs-6">${selectedItem.category}</span>
                                <span class="badge bg-warning text-dark px-3 py-2 fs-6"><i class="bi bi-star-fill"></i> ${selectedItem.rating || '4.8'}</span>
                            </div>
                            <h2 class="fw-bold mb-3">${selectedItem.title}</h2>
                            <div class="mb-4">
                                <span class="price-badge">₹${selectedItem.rate}</span>
                                <span class="text-muted fs-6">/ day</span>
                            </div>
                            <div class="p-3 bg-light rounded-3 mb-4">
                                <p class="mb-1 text-secondary">Security Deposit: <strong class="text-dark">₹${selectedItem.deposit || '2000'}</strong></p>
                                <p class="mb-0 text-secondary">Availability: <span class="badge bg-success">In Stock</span></p>
                            </div>
                            <h5 class="fw-bold mb-2">Product Description</h5>
                            <p class="text-muted mb-4">
                                Premium quality rental gear available for immediate use. Carefully inspected, fully functional, and ready for pickup or delivery.
                            </p>
                        </div>

                        <div class="d-flex gap-3 mt-4">
                            <button onclick="addToCartAndBook()" class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow">
                                <i class="bi bi-bag-check-fill me-2"></i> Proceed to Booking
                            </button>
                        </div>
                    </div>
                </div>
            `;
        });

        function addToCartAndBook() {
            const selectedItem = JSON.parse(localStorage.getItem('selected_rental_item'));
            if (!selectedItem) return;

            let cart = JSON.parse(localStorage.getItem('rental_cart')) || [];
            
          
            const exists = cart.some(item => item.id === selectedItem.id);
            if (!exists) {
                cart.push(selectedItem);
                localStorage.setItem('rental_cart', JSON.stringify(cart));
            }

           
            window.location.href = 'booking.html';
        }
    </script>
</body>
</html>
