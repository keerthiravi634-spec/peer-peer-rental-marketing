<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentExchange | Peer-to-Peer Rental Marketplace</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        .navbar {
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .hero-banner {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #2563eb 100%);
            color: white;
            padding: 90px 0;
            border-radius: 0 0 32px 32px;
        }

        .rental-card {
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            background: #ffffff;
            transition: all 0.3s ease;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .rental-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .rental-card img {
            height: 220px;
            object-fit: cover;
            width: 100%;
        }

        .price-badge {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2563eb;
        }
    </style>
</head>

<body>

   
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">

            <a class="navbar-brand fw-bold fs-4 text-primary" href="index.html">
                <i class="bi bi-arrow-repeat fs-3"></i> RentExchange
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navMain">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMain">

                <ul class="navbar-nav ms-auto align-items-center gap-3">

                    <li class="nav-item">
                        <a class="nav-link active fw-semibold" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fw-semibold" href="listings.html">
                            Browse Rentals
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fw-semibold" href="dashboard.html">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fw-semibold" href="listings-details.html">
                            Listings-Details
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="booking.html"
                           class="btn btn-outline-primary position-relative px-3 rounded-pill">

                            <i class="bi bi-cart-check"></i>
                            Bookings

                            <span id="cart-badge"
                                  class="badge bg-danger rounded-pill">
                                0
                            </span>

                        </a>
                    </li>

                    
                    <li class="nav-item d-flex gap-2" id="auth-buttons">

                        <a href="login.html"
                           class="btn btn-light text-primary border fw-semibold px-3 rounded-pill">
                            Login
                        </a>

                        <a href="register.html"
                           class="btn btn-primary fw-semibold px-3 rounded-pill">
                            Register
                        </a>

                    </li>

                </ul>

            </div>
        </div>
    </nav>


   
    <header class="hero-banner text-center">

        <div class="container">

            <h1 class="display-4 fw-extrabold mb-3">
                Rent Gadgets, Tools & Gear Nearby
            </h1>

            <p class="lead opacity-90 mb-4">
                Rent items easily or rent them out to earn!.
            </p>

            <a href="listings.html"
               class="btn btn-warning btn-lg fw-bold px-4 rounded-pill text-dark shadow">

                Explore Marketplace

            </a>

        </div>

    </header>


    
    <section class="container my-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h3 class="fw-bold">
                <i class="bi bi-fire text-danger"></i>
                Popular Rentals
            </h3>

            <a href="listings.html"
               class="text-primary fw-semibold text-decoration-none">

                View All
                <i class="bi bi-arrow-right"></i>

            </a>

        </div>


        <div class="row g-4" id="home-rental-grid">

        </div>

    </section>


    <script>

       
        const initialItems = [

            {
                id: 1,
                title: "Sony Alpha A7 IV Mirrorless Camera",
                category: "Electronics",
                rate: 1500,
                deposit: 5000,
                rating: 4.9,
                img: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=500"
            },

            {
                id: 2,
                title: "DeWalt Cordless Power Drill Set",
                category: "Tools",
                rate: 450,
                deposit: 1500,
                rating: 4.7,
                img: "https://images.unsplash.com/photo-1504148455328-c376907d081c?w=500"
            },

            {
                id: 3,
                title: "DJI Mini 3 Pro Drone with Controller",
                category: "Electronics",
                rate: 2200,
                deposit: 8000,
                rating: 5.0,
                img: "https://images.unsplash.com/photo-1508614589041-895b88991e3e?w=500"
            }

        ];


        
        if (!localStorage.getItem('rental_items')) {

            localStorage.setItem(
                'rental_items',
                JSON.stringify(initialItems)
            );

        }


       
        document.addEventListener('DOMContentLoaded', () => {

            const items =
                JSON.parse(localStorage.getItem('rental_items')) || [];

            const cart =
                JSON.parse(localStorage.getItem('rental_cart')) || [];


           
            document.getElementById('cart-badge').textContent =
                cart.length;


            
            const grid =
                document.getElementById('home-rental-grid');


            grid.innerHTML = items.map(item => `

                <div class="col-md-4">

                    <div class="card rental-card h-100">

                        <img
                            src="${item.img}"
                            alt="${item.title}"
                        >

                        <div class="card-body d-flex flex-column justify-content-between p-4">

                            <div>

                                <span class="badge bg-light text-primary border mb-2 px-3 py-2 rounded-pill">
                                    ${item.category}
                                </span>

                                <h5 class="fw-bold mb-2">
                                    ${item.title}
                                </h5>

                            </div>


                            <div>

                                <div class="d-flex justify-content-between align-items-center my-3">

                                    <span class="price-badge">

                                        ₹${item.rate}

                                        <small class="fs-6 text-muted font-normal">
                                            / day
                                        </small>

                                    </span>


                                    <span class="badge bg-warning text-dark px-2 py-1">

                                        <i class="bi bi-star-fill"></i>

                                        ${item.rating}

                                    </span>

                                </div>


                                <!-- VIEW & RENT BUTTON -->
                                <a
                                    href="listings-details.html"
                                    onclick="selectItem(${item.id})"
                                    class="btn btn-outline-secondary w-100 fw-semibold rounded-pill"
                                >

                                    View & Rent

                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            `).join('');


            
            const activeUser =
                JSON.parse(localStorage.getItem('rental_active_user'));


            if (activeUser) {

                document.getElementById('auth-buttons').innerHTML = `

                    <a
                        href="dashboard.html"
                        class="btn btn-outline-primary fw-semibold rounded-pill"
                    >

                        <i class="bi bi-person-circle"></i>

                        ${activeUser.name}

                    </a>


                    <button
                        onclick="logout()"
                        class="btn btn-danger fw-semibold rounded-pill"
                    >

                        Logout

                    </button>

                `;

            }

        });


        
       
        function selectItem(id) {

            const items =
                JSON.parse(localStorage.getItem('rental_items')) || [];


            const selected =
                items.find(item => item.id === id);


            if (selected) {

                localStorage.setItem(
                    'selected_rental_item',
                    JSON.stringify(selected)
                );

            }

        }


        
        function logout() {

            localStorage.removeItem('rental_active_user');

            window.location.reload();

        }

    </script>

</body>
</html>
