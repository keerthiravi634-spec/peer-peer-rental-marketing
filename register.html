<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentExchange | Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .reg-card { background: white; border-radius: 24px; border: 1px solid #e2e8f0; padding: 36px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 420px; }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100 justify-content-center">

    <div class="reg-card">
        <h3 class="fw-bold text-center mb-1">Create Account</h3>
        <p class="text-muted text-center mb-4">Start renting or listing items today</p>
        
        <form onsubmit="handleRegister(event)">
            <div class="mb-3">
                <label class="form-label fw-semibold">Full Name</label>
                <input type="text" id="regName" class="form-control py-2" required placeholder="John Doe">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" id="regEmail" class="form-control py-2" required placeholder="name@example.com">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control py-2" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-pill mt-2">Create Account</button>
        </form>

        <p class="text-center text-muted mt-4 mb-0">Already registered? <a href="login.html" class="text-primary text-decoration-none fw-semibold">Login</a></p>
    </div>

    <script>
        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            localStorage.setItem('rental_active_user', JSON.stringify({ name, email }));
            alert("Account Created Successfully!");
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
