<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentExchange | Browse Listings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .filter-box { background: white; border-radius: 20px; border: 1px solid #e2e8f0; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .rental-card { border: 1px solid #e2e8f0; border-radius: 16px; background: white; overflow: hidden; }
        .rental-card img { height: 180px; object-fit: cover; width: 100%; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 text-primary" href="index.html"><i class="bi bi-arrow-repeat"></i> RentExchange</a>
            <a href="listings-details.html">View & Rent</a>
            <a href="booking.html" class="btn btn-outline-primary rounded-pill">Bookings</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row g-4">
            <div class="col-md-3">
                <div class="filter-box">
                    <h5 class="fw-bold mb-3"><i class="bi bi-funnel"></i> Search Filter</h5>
                    <div class="mb-3">
                        <label class="form-label font-semibold">Keyword</label>
                        <input type="text" id="searchInput" class="form-control" placeholder="Search item...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label font-semibold">Category</label>
                        <select id="catSelect" class="form-select">
                            <option value="All">All Categories</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Tools">Tools</option>
                        </select>
                    </div>
                    <button onclick="filterItems()" class="btn btn-primary w-100 rounded-pill">Filter Results</button>
                </div>
            </div>

            <div class="col-md-9">
                <div class="row g-4" id="listings-grid"></div>
            </div>
        </div>
    </div>

    <script>
        const items = JSON.parse(localStorage.getItem('rental_items')) || [];

        function render(data) {
            const grid = document.getElementById('listings-grid');
            grid.innerHTML = data.map(item => `
                <div class="col-md-4">
                    <div class="card rental-card h-100">
                        <img src="${item.img}" alt="${item.title}">
                        <div class="card-body p-3 d-flex flex-column justify-content-between">
                            <div>
                                <span class="badge bg-light text-dark border mb-2">${item.category}</span>
                                <h6 class="fw-bold">${item.title}</h6>
                                <p class="text-primary fw-bold mb-1">₹${item.rate} / day</p>
                            </div>
                            <button onclick="selectAndGo(${item.id})" class="btn btn-outline-primary btn-sm rounded-pill w-100 mt-2">View & Rent</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        render(items);

        function filterItems() {
            const key = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('catSelect').value;
            const filtered = items.filter(i => (cat === 'All' || i.category === cat) && i.title.toLowerCase().includes(key));
            render(filtered);
        }

        function selectAndGo(id) {
            const selected = items.find(i => i.id === id);
            localStorage.setItem('selected_rental_item', JSON.stringify(selected));
            window.location.href = 'listing-details.html';
        }
    </script>
</body>
</html>
