<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentExchange | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .login-card { background: white; border-radius: 24px; border: 1px solid #e2e8f0; padding: 36px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100 justify-content-center">

    <div class="login-card">
        <h3 class="fw-bold text-center mb-1">Welcome Back</h3>
        <p class="text-muted text-center mb-4">Login to your RentExchange account</p>
        
        <form onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" id="loginEmail" class="form-control py-2" required placeholder="name@example.com">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control py-2" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-pill mt-2">Sign In</button>
        </form>

        <p class="text-center text-muted mt-4 mb-0">Don't have an account? <a href="register.html" class="text-primary text-decoration-none fw-semibold">Register</a></p>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const name = email.split('@')[0];
            localStorage.setItem('rental_active_user', JSON.stringify({ name, email }));
            alert("Login Successful!");
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
